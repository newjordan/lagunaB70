<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title id="t">Laguna B70 speed vs the stock build</title>
<desc id="d">Writing an answer runs at 136 tokens per second versus 108 for the stock build, 26 percent faster. Reading a prompt is about 3 percent faster at 512, 2048, 4096 and 8192 tokens.</desc>
<rect width="880" height="480" fill="#1a1a19"/>
<text x="32.0" y="44" font-size="23" fill="#ffffff" font-weight="600" text-anchor="start">Laguna B70 vs the stock build</text>
<text x="32.0" y="68" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Laguna-XS-2.1 Q4_K_M · Intel Arc Pro B70 · one request at a time · tok/s, higher is better</text>
<text x="848.0" y="44" font-size="13" fill="#c3c2b7" font-weight="500" text-anchor="end">lagunaB70</text>
<rect x="766.1" y="35" width="10" height="10" rx="2" fill="#3987e5"/>
<text x="744.1" y="44" font-size="13" fill="#c3c2b7" font-weight="500" text-anchor="end">stock</text>
<rect x="690.6" y="35" width="10" height="10" rx="2" fill="#6b6a65"/>
<text x="32.0" y="112" font-size="11.5" fill="#c3c2b7" font-weight="600" text-anchor="start" letter-spacing="0.09em">WRITING AN ANSWER — 128 tokens</text>
<path d="M166 126 H511.7 A4 4 0 0 1 515.7 130 V156 A4 4 0 0 1 511.7 160 H166 Z" fill="#6b6a65"/>
<text x="150.0" y="148" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="end">stock</text>
<text x="529.7" y="150" font-size="21" fill="#ffffff" font-weight="600" text-anchor="start">108</text>
<text x="568.7" y="150" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">tok/s</text>
<path d="M166 172 H602.0 A4 4 0 0 1 606.0 176 V202 A4 4 0 0 1 602.0 206 H166 Z" fill="#3987e5"/>
<text x="150.0" y="194" font-size="14" fill="#c3c2b7" font-weight="600" text-anchor="end">lagunaB70</text>
<text x="620.0" y="196" font-size="21" fill="#ffffff" font-weight="600" text-anchor="start">136</text>
<text x="659.0" y="196" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">tok/s</text>
<text x="848.0" y="197" font-size="17" fill="#0ca30c" font-weight="700" text-anchor="end">+26% vs stock</text>
<line x1="32" y1="242" x2="848" y2="242" stroke="#2c2c2a" stroke-width="1"/>
<text x="32.0" y="272" font-size="11.5" fill="#c3c2b7" font-weight="600" text-anchor="start" letter-spacing="0.09em">READING A PROMPT — by prompt length · separate scale</text>
<text x="150.0" y="310" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="end">512 tok</text>
<path d="M166 292 H364.7 A4 4 0 0 1 368.7 296 V299 A4 4 0 0 1 364.7 303 H166 Z" fill="#6b6a65"/>
<text x="378.7" y="301.5" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">1,142</text>
<path d="M166 306 H370.3 A4 4 0 0 1 374.3 310 V313 A4 4 0 0 1 370.3 317 H166 Z" fill="#3987e5"/>
<text x="384.3" y="315.5" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">1,174</text>
<text x="150.0" y="350" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="end">2048 tok</text>
<path d="M166 332 H508.7 A4 4 0 0 1 512.7 336 V339 A4 4 0 0 1 508.7 343 H166 Z" fill="#6b6a65"/>
<text x="522.7" y="341.5" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">1,954</text>
<path d="M166 346 H522.0 A4 4 0 0 1 526.0 350 V353 A4 4 0 0 1 522.0 357 H166 Z" fill="#3987e5"/>
<text x="536.0" y="355.5" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">2,029</text>
<text x="150.0" y="390" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="end">4096 tok</text>
<path d="M166 372 H504.9 A4 4 0 0 1 508.9 376 V379 A4 4 0 0 1 504.9 383 H166 Z" fill="#6b6a65"/>
<text x="518.9" y="381.5" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">1,933</text>
<path d="M166 386 H517.3 A4 4 0 0 1 521.3 390 V393 A4 4 0 0 1 517.3 397 H166 Z" fill="#3987e5"/>
<text x="531.3" y="395.5" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">2,002</text>
<text x="150.0" y="430" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="end">8192 tok</text>
<path d="M166 412 H495.5 A4 4 0 0 1 499.5 416 V419 A4 4 0 0 1 495.5 423 H166 Z" fill="#6b6a65"/>
<text x="509.5" y="421.5" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">1,880</text>
<path d="M166 426 H508.0 A4 4 0 0 1 512.0 430 V433 A4 4 0 0 1 508.0 437 H166 Z" fill="#3987e5"/>
<text x="522.0" y="435.5" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">1,950</text>
<text x="32.0" y="462" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Stock is the same binary and the same model file with these kernels off. Each panel has its own scale; every bar starts at zero.</text>
</svg>
